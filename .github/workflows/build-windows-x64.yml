name: build-windows-x64

on:
  workflow_dispatch:

env:
  GO_VERSION: "1.24"
  FLUTTER_VERSION: "3.41.2"
  APP_VERSION: "1.9.3"

permissions:
  contents: read

jobs:
  build-windows-amd64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build (go core + flutter windows)
        shell: pwsh
        env:
          VERSION: ${{ env.APP_VERSION }}
        run: |
          $ErrorActionPreference = "Stop"

          go build -tags nosqlite -ldflags="-w -s -X github.com/GopeedLab/gopeed/pkg/base.Version=$env:VERSION" -buildmode=c-shared -o ui/flutter/windows/libgopeed.dll github.com/GopeedLab/gopeed/bind/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/host.exe github.com/GopeedLab/gopeed/cmd/host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -ldflags="-w -s" -o ui/flutter/assets/exec/updater.exe github.com/GopeedLab/gopeed/cmd/updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cd ui/flutter
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --dart-define="UPDATE_CHANNEL=windowsPortable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $TAG = "v$env:VERSION"
          $release = "build\windows\x64\runner\Release"

          # Git for Windows no longer ships libstdc++-6.dll in newer releases,
          # look for the mingw runtime in every usual place instead.
          $gcc = Get-Command gcc.exe -ErrorAction SilentlyContinue
          $candidates = @()
          if ($gcc) { $candidates += (Split-Path $gcc.Source -Parent) }
          $candidates += @(
            "C:\tools\msys64\mingw64\bin",
            "C:\msys64\mingw64\bin",
            "C:\Program Files\Git\mingw64\bin",
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          )
          function Copy-MingwDll($name, $dest) {
            foreach ($dir in $candidates) {
              if (-not (Test-Path $dir)) { continue }
              $p = Join-Path $dir $name
              if (Test-Path $p) {
                Copy-Item $p $dest -Force
                Write-Host "copied $name from $dir"
                return
              }
            }
            Write-Warning "mingw dll not found, skipped: $name"
          }
          foreach ($name in @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll")) {
            Copy-MingwDll $name $release
          }
          foreach ($name in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            $src = Join-Path $env:SystemRoot "System32\$name"
            if (Test-Path $src) {
              Copy-Item $src $release -Force
            } else {
              Write-Warning "system dll not found, skipped: $name"
            }
          }

          New-Item -Path build\windows\Output -ItemType Directory -Force | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "build\windows\Output\Gopeed-$TAG-windows-amd64-portable.zip" -Force
          Get-ChildItem build\windows\Output

      - name: Build installer (optional)
        continue-on-error: true
        shell: pwsh
        env:
          VERSION: ${{ env.APP_VERSION }}
        run: |
          cd build/windows
          $TAG = "v$env:VERSION"
          $iss = @"
          #define MyAppName "Gopeed"
          #define MyAppVersion "$env:VERSION"
          #define MyAppPublisher "monkeyWie"
          #define MyAppURL "https://gopeed.com"
          #define MyAppExeName "gopeed.exe"

          [Setup]
          AppId={{5960F34D-1E42-402C-8C85-DE2FF24CBAE4}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={autopf}\gopeed
          DisableProgramGroupPage=yes
          LicenseFile=..\..\..\..\LICENSE
          PrivilegesRequired=lowest
          OutputBaseFilename=gopeed
          SetupIconFile=..\..\assets\icon\icon.ico
          UninstallDisplayIcon={app}\{#MyAppExeName}
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          CloseApplications=force

          [Tasks]
          Name: "desktopicon"; Description: "Create desktop icon"; Flags: unchecked

          [Files]
          Source: ".\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs;

          [UninstallDelete]
          Type: filesandordirs; Name: "{app}"

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path setup.iss -Value $iss -Encoding UTF8
          & iscc.exe setup.iss
          Move-Item "Output\gopeed.exe" "Output\Gopeed-$TAG-windows-amd64-setup.exe" -Force
          Get-ChildItem Output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gopeed-windows-x64-v1.9.3
          path: ui/flutter/build/windows/Output/*
          if-no-files-found: warn
          retention-days: 30